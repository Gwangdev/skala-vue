# Public surface spec — never build what is not listed here.
#
# Written in /design, frozen during /build. `tools/gate.py` compares this against
# the endpoints it extracts from the actual code.
#
#   in spec, not in code  ->  S3 missing           (BLOCK)
#   in code, not in spec  ->  S4 excess            (BLOCK)
#
# Path variable names are ignored in the comparison: {id}, {orderId}, and Flask's
# <id> are treated as the same. Use meaningful names for human readers.
#
# If this file must change mid-build, go back to /design §5. Growing the spec to
# match the code turns the spec into a copy of the code, and the diff catches nothing.

version: 1

# Run by `gate.py --commit` right before each commit. Test files existing (T1) and
# tests passing are different facts. Leave it out and the gate warns instead.
test_command: ""        # e.g. "./gradlew test" | "python3 -m pytest -q"

# Where the service's own code lives. Anything outside is not counted as public
# surface. Leave it out and the whole repo is scanned — existing projects are
# unaffected.
#
# Use it when the repo also holds code that is not the service's surface: sample
# projects, grading or test fixtures, another service in a monorepo. Their
# controllers would otherwise show up as S4 (excess). Do not push those into
# `exclude` — that list means "our surface, deliberately unmanaged" and carries a
# reason for each entry, so mixing in "not our code at all" makes the two
# indistinguishable, and the list grows with every fixture you add.
#
# code_roots:
#   - backend/src/main

# 컬렉션 전체를 대상으로 하는 PUT/DELETE는 한 번의 오작동으로 데이터셋을 지운다.
# `gate.py`가 A4로 막고, 정말 필요하면 항목에 사유를 달아 의도를 남긴다.
#
#   - endpoint: DELETE /api/sessions
#     reason: 만료 세션 일괄 정리 — 관리자 권한·감사 로그 적용
#
# exclude와 혼동하지 않는다. exclude는 명세 관리 밖의 경로용이고, 거기 적으면
# S3·S4 대조에서도 함께 빠진다.

endpoints:
  # - GET    /api/orders
  # - GET    /api/orders/{id}
  # - POST   /api/orders
  # - DELETE /api/orders/{id}

exclude:
  # Only for paths outside spec management, such as framework-provided endpoints.
  # Always record the reason. An exclude without a reason disables the diff.
  # - endpoint: GET /actuator/health
  #   reason: provided by Spring Boot Actuator
